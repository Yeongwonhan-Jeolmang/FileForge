[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fileforge"
version = "1.2.0"
description = "Cross-platform desktop application for inspecting and editing file metadata and file attributes."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [ { name = "FileForge" } ]
keywords = ["file", "metadata", "PyQt5", "desktop", "file management"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Win32 (MS Windows)",
  "Environment :: MacOS X",
  "Environment :: X11 Applications :: Qt",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

dependencies = [
  "PyQt5>=5.15",
  "Pillow>=9.1",
  "mutagen",
  "pypdf>=3.0",
  "python-docx",
  "python-pptx",
  "openpyxl",
  "py7zr",
  "pymediainfo",
]
urls = { "Repository" = "https://github.com/Yeongwonhan-Jeolmang/FileForge" }

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
fileforge = "main:main"

[project.gui-scripts]
fileforge-gui = "main:main"

[tool.setuptools]
packages = ["modules"]
py-modules = ["main"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyrefly]
project-includes = ["main.py", "modules", "tests"]
project-excludes = ["**/.venv/**", "**/venv/**", "build/**", "dist/**"]
python-interpreter-path = ".venv/bin/python"
# PyQt5's bundled type stubs don't model Qt enums, bound signals or nullable
# getters in a way Pyrefly understands, so the stricter presets bury real
# problems under hundreds of false positives. Start from "basic" and switch on
# the extra checks that are actually useful for this codebase.
preset = "basic"
# PyPDF2 is only an optional fallback when the maintained `pypdf` is missing.
ignore-missing-imports = ["PyPDF2", "PyPDF2.*"]

[tool.pyrefly.errors]
bad-assignment = true
bad-function-definition = true
unbound-name = true
unsupported-operation = true
missing-module-attribute = true
